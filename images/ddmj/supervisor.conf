[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm8.3 -F
autostart=true
autorestart=true
priority=10

[program:web-admin-dev]
directory=/var/www/web-admin
command=node node_modules/vite/bin/vite.js --host 0.0.0.0 --port 3001
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/web-admin.log
stderr_logfile=/var/log/supervisor/web-admin-error.log
priority=20

[program:app-h5-dev]
directory=/var/www/app
command=sh -c "UNI_INPUT_DIR=$(pwd) npx uni --host 0.0.0.0 --port 3002"
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/app-h5.log
stderr_logfile=/var/log/supervisor/app-h5-error.log
priority=30

[program:laravel-queue]
directory=/var/www/laravel-rest-api
command=php artisan queue:work --sleep=3 --tries=3
autostart=false
autorestart=true
stdout_logfile=/var/log/supervisor/queue.log
stderr_logfile=/var/log/supervisor/queue-error.log
priority=40

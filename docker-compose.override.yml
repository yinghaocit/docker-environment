services:
  # ---- 三站 web-server (基于 local/web-service:1.0.0, amd64) ----
  wyethnutrition-china-web-server:
    platform: linux/amd64
    container_name: wyethnutrition-china-web-server
    image: local/web-service:1.0.0
    networks:
      - default-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /Volumes/DevWorkspace/Projects/wyeth/wyeth-nutrition-china-website/source:/var/www/html
    depends_on:
      - database

  illuminate-web-server:
    platform: linux/amd64
    container_name: illuminate-web-server
    image: local/web-service:1.0.0
    networks:
      - default-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /Volumes/DevWorkspace/Projects/wyeth/illuminate/source:/var/www/html
    depends_on:
      - database

  wyethbb-web-server:
    platform: linux/amd64
    container_name: wyethbb-web-server
    image: local/web-service:1.0.0
    networks:
      - default-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /Volumes/DevWorkspace/Projects/wyeth/wyethbb/source:/var/www/html
    depends_on:
      - database

  # ---- ddmj 三合一 (laravel-rest-api + web-admin + app/h5) ----
  ddmj:
    platform: linux/amd64
    container_name: ddmj
    image: local/ddmj-dev:1.0.0
    networks:
      - default-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /Volumes/DevWorkspace/Projects/ddmj/laravel-rest-api:/var/www/laravel-rest-api
      - /Volumes/DevWorkspace/Projects/ddmj/web-admin:/var/www/web-admin
      - /Volumes/DevWorkspace/Projects/ddmj/app:/var/www/app
    expose:
      - "9000"
      - "3001"
      - "3002"
    depends_on:
      - database

  # ---- 共享 nginx 补 HTTP(80) 端口 (本地开发用; SSL 后续按需加) ----
  nginx:
    ports:
      - "80:80"
      - "443:443"

networks:
  default-network:
